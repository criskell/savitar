[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
savitar-diagnostics = { path = "crates/savitar-diagnostics" }
savitar-types = { path = "crates/savitar-types" }
savitar-ir = { path = "crates/savitar-ir" }
savitar-lower = { path = "crates/savitar-lower" }
savitar-typeinfo = { path = "crates/savitar-typeinfo" }
savitar-typeinfo-tsapi = { path = "crates/savitar-typeinfo-tsapi" }
savitar-sound = { path = "crates/savitar-sound" }

oxc_allocator = "0.154.0"
oxc_ast = "0.154.0"
oxc_parser = "0.154.0"
oxc_semantic = "0.154.0"
oxc_span = "0.154.0"
jsonc-parser = "0.34.0"
serde_json = "1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
